<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: beige;
            color: black;
        }
        h1, h2, h3 {
            color: black;
        }
    </style>
    <title>Nexoria - Sneha Sharma Consultant</title>
</head>
<body>
    <header>
        <h1>Nexoria</h1>
        <h2>Sneha Sharma - Consultant</h2>
    </header>
    <main>
        <form>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="sneha.sharma@nexoria.com" required>

            <label for="linkedin">LinkedIn:</label>
            <input type="text" id="linkedin" name="linkedin" placeholder="Your LinkedIn URL" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Send</button>
        </form>
        <p>Tailored for small and new businesses.</p>
    </main>
</body>
</html>
